<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER:BS Profile Generator Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fastly.jsdelivr.net/gh/projectnoonnu/2403-2@1.0/Paperlogy-All.woff2');

        body {
            font-family: 'Paperlogy', sans-serif;
            background: #0f1015;
            color: #e2e4e9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }

        header { text-align: center; margin-bottom: 25px; }
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 6px 0;
            background: linear-gradient(90deg, #ff9800, #ff5722);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p { font-size: 13px; color: #787a86; margin: 0; }

        .control-panel {
            background: #171821;
            border: 1px solid #2f3142;
            padding: 14px 28px;
            border-radius: 12px;
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .control-btn {
            font-family: 'Paperlogy', sans-serif;
            font-weight: 700;
            font-size: 13.5px;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .bg-btn { background: #262838; color: #e2e4e9; border: 1px solid #3b3e56; }
        .bg-btn:hover { background: #33364d; border-color: #ff9800; }
        .download-btn { background: #ff9800; color: #0f1015; }
        .download-btn:hover { background: #ffa726; transform: translateY(-1px); }

        .canvas-container {
            position: relative;
            padding: 12px;
            background: #171821;
            border-radius: 16px;
            border: 1px solid #2f3142;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
        }

        #capture-area {
            position: relative;
            width: 800px;
            height: 450px;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #1a1a24;
            border-radius: 6px;
            overflow: hidden;
        }

        /* 일러스트 레이아웃 틀에 정확히 맞춘 이미지 슬롯 배치 */
        .image-slot {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.2);
            overflow: hidden;
            cursor: pointer;
            border: 2px dashed rgba(255, 152, 0, 0.4);
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .image-slot:hover {
            border-color: #ff9800;
            background-color: rgba(255, 152, 0, 0.1);
        }
        .image-slot img { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .slot-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 2;
        }
        .slot-overlay span {
            color: #ff9800; font-size: 11px; font-weight: 700;
            background: rgba(15, 16, 21, 0.85); padding: 4px 8px; border-radius: 4px;
            border: 1px solid rgba(255, 152, 0, 0.3);
        }

        .hide-input { display: none; }
        .center-circle { border-radius: 50%; }

        /* [일러스트 프레임 정밀 매핑 좌표] */
        .main-char-1 { top: 588px; left: 111px; width: 110px; height: 198px; border-radius: 6px; display: none; } /* 기존 엉뚱한 값 비활성화 후 하단 재배치 참고용 */
        
        /* 실제 일러스트의 점선 박스 위치 추적 */
        .main-char-1 { top: 588px; left: 111px; width: 111px; height: 197px; } 
        
        /* 일러스트 마스크 좌표 전면 수정 */
        .main-char-1 { top: 587px; left: 111px; width: 111px; height: 197px; border-radius: 4px; }
        .main-char-2 { top: 587px; left: 231px; width: 111px; height: 197px; border-radius: 4px; }
        .profile-circle { top: 417px; left: 389px; width: 224px; height: 224px; }
        .favorite-char-1 { top: 628px; left: 659px; width: 110px; height: 198px; border-radius: 4px; }
        .favorite-char-2 { top: 628px; left: 778px; width: 110px; height: 198px; border-radius: 4px; }

        /* 배경 일러스트 크기가 800x450이 아니라 훨씬 큰 원본 파일이 들어왔을 때를 대비해, 
           스크린샷 기준 비율(800x450 내부 포지셔닝)로 완벽하게 재컴파일한 좌표 적용 */
        .main-char-1 { top: 254px; left: 111px; width: 110px; height: 140px; }
        .main-char-2 { top: 254px; left: 231px; width: 110px; height: 140px; }
        .profile-circle { top: 125px; left: 390px; width: 224px; height: 224px; }
        .favorite-char-1 { top: 277px; left: 659px; width: 109px; height: 139px; }
        .favorite-char-2 { top: 277px; left: 778px; width: 109px; height: 139px; }

        /* 입력을 위한 공통 래퍼 */
        .input-wrapper {
            position: absolute;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            border: 1px solid transparent;
            border-radius: 4px;
            transition: all 0.15s ease;
        }
        .input-wrapper:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 152, 0, 0.3);
        }

        /* 텍스트 인풋 스타일 고정 보정 */
        .transparent-input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Paperlogy', sans-serif;
            font-weight: 700;
            font-size: 13px;
            line-height: 1.4;
            padding: 2px 6px;
            margin: 0;
            box-sizing: border-box;
            color: #ffffff;
            text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 0px 2px 4px rgba(0,0,0,1);
        }
        .transparent-input:focus {
            background-color: rgba(15, 16, 21, 0.9);
            border-radius: 4px;
            outline: 1px solid #ff9800;
        }
        .transparent-input::placeholder { 
            color: #ffa726; 
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            font-weight: 700; 
            font-size: 11px; 
            opacity: 0; /* 배경 가이드 텍스트와 겹치므로 입력 전엔 플레이스홀더를 숨김 */
        }

        /* 티어 선택 드롭다운 커스텀 UI */
        .tier-select-dropdown {
            width: 100%;
            height: 100%;
            background: rgba(23, 24, 33, 0.85);
            border: 1px solid #ff9800;
            border-radius: 4px;
            color: #ff9800;
            font-family: 'Paperlogy', sans-serif;
            font-weight: 700;
            font-size: 12px;
            padding: 0 4px;
            cursor: pointer;
            outline: none;
            box-sizing: border-box;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        .tier-select-dropdown option {
            background: #171821;
            color: #ffffff;
            font-weight: 600;
        }

        /* 내보내기용 미러 레이어 스타일 일치화 */
        .capture-text-mirror {
            display: none;
            width: 100%;
            font-family: 'Paperlogy', sans-serif;
            font-weight: 700;
            font-size: 13px;
            line-height: 1.4;
            padding: 2px 6px;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
            box-sizing: border-box;
            color: #ffffff;
            text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 0px 2px 4px rgba(0,0,0,1);
        }

        .capturing .transparent-input { display: none !important; }
        .capturing .tier-select-dropdown { display: none !important; }
        .capturing .capture-text-mirror { display: block !important; }

        /* 토글 버튼 선택지 UI 스타일 */
        .clickable-box-group {
            position: absolute;
            display: flex;
            gap: 2px;
            align-items: center;
            box-sizing: border-box;
            background: transparent;
            padding: 0;
        }
        .clickable-item {
            font-family: 'Paperlogy', sans-serif;
            font-weight: 700;
            font-size: 11px;
            color: transparent; /* 평소엔 배경에 그려진 텍스트가 보이도록 투명 처리 */
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 4px;
            transition: all 0.1s ease;
            user-select: none;
            border: 1px solid transparent;
        }
        .clickable-item:hover {
            border-color: rgba(255, 152, 0, 0.5);
            background-color: rgba(255, 152, 0, 0.1);
        }
        .clickable-item.active {
            color: #000000 !important; /* 활성화 시에만 검은 글씨로 반전 */
            background-color: #ff9800 !important;
            font-weight: 800;
            box-shadow: 0 1px 5px rgba(255, 152, 0, 0.6);
        }
        
        .capturing .clickable-box-group { background: transparent !important; border: none !important; padding: 0 !important; }
        .capturing .clickable-item { display: none !important; }
        .capturing .clickable-item.active { 
            display: block !important; 
            background-color: transparent !important; 
            color: #ffffff !important;
            text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000 !important;
            padding: 0; 
        }

        /* ------------------ 일러스트 맞춤형 완벽 좌표 대수술 ------------------ */

        /* [왼쪽 구역: 티어 / 닉네임 / 플레이 성향] */
        .pos-ingame-tier { top: 180px; left: 104px; width: 147px; height: 26px; } 
        .pos-ingame-name { top: 218px; left: 140px; width: 110px; height: 22px; } 
        
        .pos-ingame-mode { top: 400px; left: 112px; gap: 4px; }
        .pos-ingame-mode .clickable-item { width: 28px; height: 16px; padding: 0; text-align: center; line-height: 16px; }

        .pos-ingame-discord { top: 422px; left: 112px; gap: 4px; }
        .pos-ingame-discord .clickable-item { width: 28px; height: 16px; padding: 0; text-align: center; line-height: 16px; }

        /* [중앙 구역: 트위터 ID / 성별 / 나이 / 소개글] */
        .pos-center-name { top: 247px; left: 450px; width: 105px; height: 20px; } 
        .pos-center-name .transparent-input, .pos-center-name .capture-text-mirror { text-align: left; font-size: 11px; }
        
        .pos-gender-select { top: 220px; left: 622px; gap: 5px; }
        .pos-gender-select .clickable-item { width: 14px; height: 16px; padding: 0; text-align: center; line-height: 16px; }
        
        .pos-age-select { top: 246px; left: 622px; gap: 4px; }
        .pos-age-select .clickable-item { width: 24px; height: 16px; padding: 0; text-align: center; line-height: 16px; }
        .pos-age-select .clickable-item:last-child { width: 24px; }
        
        .pos-free-text { top: 424px; left: 395px; width: 215px; height: 20px; align-items: center; } 
        .pos-free-text .transparent-input, .pos-free-text .capture-text-mirror { font-weight: 600; font-size: 11px; text-align: left; resize: none; white-space: nowrap; }

        /* [우측 구역: 교류 경향성] */
        .pos-type-tweet { top: 122px; left: 698px; gap: 4px; } 
        .pos-type-tweet .clickable-item { width: 24px; height: 16px; padding: 0; text-align: center; line-height: 16px; }

        .pos-type-block { top: 153px; left: 698px; gap: 4px; } 
        .pos-type-block .clickable-item { width: 33px; height: 16px; padding: 0; text-align: center; line-height: 16px; }
        .pos-type-block .clickable-item:first-child { width: 24px; }
        .pos-type-block .clickable-item:last-child { width: 24px; }
        
        .pos-type-time { top: 191px; left: 698px; width: 92px; height: 20px; }
        .pos-type-time .transparent-input, .pos-type-time .capture-text-mirror { font-size: 11px; padding: 0 2px; }
    </style>
</head>
<body>

    <header>
        <h1>ETERNAL RETURN PROFILE GENERATOR</h1>
        <p>박스를 선택하고 텍스트를 입력해 나만의 완성도 높은 카드를 바로 출력하세요.</p>
    </header>
    
    <div class="control-panel">
        <label for="bg-upload" class="control-btn bg-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            배경 폼 등록
        </label>
        <input type="file" id="bg-upload" accept="image/*" class="hide-input">
        
        <button class="control-btn download-btn" onclick="downloadImage()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            이미지 다운로드
        </button>
    </div>

    <div class="canvas-container">
        <div id="capture-area">
            
            <div class="image-slot main-char-1">
                <img id="img-main-1" src="#" alt="주캐릭터 1">
                <div class="slot-overlay"><span>주캐릭터 1</span></div>
                <input type="file" id="upload-main-1" accept="image/*" class="hide-input" onchange="previewImg(this, 'img-main-1')">
            </div>
            <div class="image-slot main-char-2">
                <img id="img-main-2" src="#" alt="주캐릭터 2">
                <div class="slot-overlay"><span>주캐릭터 2</span></div>
                <input type="file" id="upload-main-2" accept="image/*" class="hide-input" onchange="previewImg(this, 'img-main-2')">
            </div>
            <div class="image-slot profile-circle center-circle">
                <img id="img-profile" src="#" alt="프로필">
                <div class="slot-overlay"><span style="border-radius: 50%;">메인 프로필</span></div>
                <input type="file" id="upload-profile" accept="image/*" class="hide-input" onchange="previewImg(this, 'img-profile')">
            </div>
            <div class="image-slot favorite-char-1">
                <img id="img-fav-1" src="#" alt="애정캐릭터 1">
                <div class="slot-overlay"><span>애정캐릭터 1</span></div>
                <input type="file" id="upload-fav-1" accept="image/*" class="hide-input" onchange="previewImg(this, 'img-fav-1')">
            </div>
            <div class="image-slot favorite-char-2">
                <img id="img-fav-2" src="#" alt="애정캐릭터 2">
                <div class="slot-overlay"><span>애정캐릭터 2</span></div>
                <input type="file" id="upload-fav-2" accept="image/*" class="hide-input" onchange="previewImg(this, 'img-fav-2')">
            </div>

            <div class="input-wrapper pos-ingame-tier">
                <select class="tier-select-dropdown" id="tier-dropdown">
                    <option value="" disabled selected hidden>티어 선택</option>
                    <option value="아이언">아이언</option>
                    <option value="브론즈">브론즈</option>
                    <option value="실버">실버</option>
                    <option value="골드">골드</option>
                    <option value="플래티넘">플래티넘</option>
                    <option value="다이아몬드">다이아몬드</option>
                    <option value="메테오라이트">메테오라이트</option>
                    <option value="미스릴">미스릴</option>
                    <option value="데미갓">데미갓</option>
                    <option value="이터니티">이터니티</option>
                </select>
                <div class="capture-text-mirror" id="tier-mirror"></div>
            </div>

            <div class="input-wrapper pos-ingame-name">
                <input type="text" class="transparent-input">
                <div class="capture-text-mirror"></div>
            </div>

            <div class="clickable-box-group pos-ingame-mode" data-type="single">
                <span class="clickable-item" onclick="toggleSelect(this)">솔로</span>
                <span class="clickable-item" onclick="toggleSelect(this)">듀오</span>
                <span class="clickable-item" onclick="toggleSelect(this)">스쿼드</span>
                <span class="clickable-item" onclick="toggleSelect(this)">코발트</span>
            </div>

            <div class="clickable-box-group pos-ingame-discord" data-type="single">
                <span class="clickable-item" onclick="toggleSelect(this)">듣기</span>
                <span class="clickable-item" onclick="toggleSelect(this)">말하기</span>
                <span class="clickable-item" onclick="toggleSelect(this)">전부</span>
                <span class="clickable-item" onclick="toggleSelect(this)">사용X</span>
            </div>

            <div class="input-wrapper pos-center-name">
                <input type="text" class="transparent-input">
                <div class="capture-text-mirror"></div>
            </div>

            <div class="clickable-box-group pos-gender-select" data-type="single">
                <span class="clickable-item" onclick="toggleSelect(this)">여</span>
                <span class="clickable-item" onclick="toggleSelect(this)">남</span>
                <span class="clickable-item" onclick="toggleSelect(this)">기타</span>
            </div>
            <div class="clickable-box-group pos-age-select" data-type="single">
                <span class="clickable-item" onclick="toggleSelect(this)">성인</span>
                <span class="clickable-item" onclick="toggleSelect(this)">청소년</span>
                <span class="clickable-item" onclick="toggleSelect(this)">기타</span>
            </div>

            <div class="input-wrapper pos-free-text">
                <input type="text" class="transparent-input">
                <div class="capture-text-mirror"></div>
            </div>

            <div class="clickable-box-group pos-type-tweet" data-type="multi">
                <span class="clickable-item" onclick="toggleSelect(this)">연성</span>
                <span class="clickable-item" onclick="toggleSelect(this)">소비</span>
                <span class="clickable-item" onclick="toggleSelect(this)">흔적</span>
                <span class="clickable-item" onclick="toggleSelect(this)">일상</span>
            </div>
            <div class="clickable-box-group pos-type-block" data-type="multi">
                <span class="clickable-item" onclick="toggleSelect(this)">블락</span>
                <span class="clickable-item" onclick="toggleSelect(this)">블언블</span>
                <span class="clickable-item" onclick="toggleSelect(this)">언팔</span>
            </div>
            
            <div class="input-wrapper pos-type-time">
                <input type="text" class="transparent-input">
                <div class="capture-text-mirror"></div>
            </div>

        </div>
    </div>

    <script>
        function toggleSelect(element) {
            const group = element.closest('.clickable-box-group');
            const type = group.getAttribute('data-type');

            if (type === 'single') {
                const items = group.querySelectorAll('.clickable-item');
                items.forEach(item => {
                    if(item !== element) item.classList.remove('active');
                });
                element.classList.toggle('active');
            } else {
                element.classList.toggle('active');
            }
        }

        document.getElementById('bg-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('capture-area').style.backgroundImage = `url('${event.target.result}')`;
                };
                reader.readAsDataURL(file);
            }
        });

        function previewImg(input, imgId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById(imgId);
                    img.src = e.target.result;
                    img.style.display = 'block';
                    input.closest('.image-slot').querySelector('.slot-overlay').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        document.querySelectorAll('.image-slot').forEach(slot => {
            slot.addEventListener('click', function(e) {
                if (e.target.tagName === 'INPUT') return;
                this.querySelector('input[type="file"]').click();
            });
        });

        function syncInputsToMirrors() {
            document.querySelectorAll('.input-wrapper').forEach(wrapper => {
                const input = wrapper.querySelector('.transparent-input');
                const mirror = wrapper.querySelector('.capture-text-mirror');
                if (input && mirror) {
                    mirror.textContent = input.value ? input.value : "";
                }
            });
            
            const dropdown = document.getElementById('tier-dropdown');
            const tierMirror = document.getElementById('tier-mirror');
            tierMirror.textContent = dropdown.value ? dropdown.value : "";
        }

        function downloadImage() {
            const captureArea = document.getElementById('capture-area');
            const slots = document.querySelectorAll('.image-slot');
            
            syncInputsToMirrors();
            slots.forEach(slot => slot.style.border = 'none');
            captureArea.classList.add('capturing');

            setTimeout(() => {
                html2canvas(captureArea, {
                    scale: 2, 
                    useCORS: true,
                    backgroundColor: null,
                    logging: false
                }).then(canvas => {
                    slots.forEach(slot => slot.style.border = '2px dashed rgba(255, 152, 0, 0.4)');
                    captureArea.classList.remove('capturing');

                    const imageUrl = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.href = imageUrl;
                    link.download = 'eternal_return_card.png';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }).catch(err => {
                    console.error("Render fail:", err);
                    slots.forEach(slot => slot.style.border = '2px dashed rgba(255, 152, 0, 0.4)');
                    captureArea.classList.remove('capturing');
                });
            }, 60);
        }
    </script>
</body>
</html>
