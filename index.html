<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이터널리턴 트친소표 제작기</title>
    <link rel="stylesheet" href="style.css?v=20260529-readflow1" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">이터리고?</p>
        <h1>이터널리턴 트친소표 제작기</h1>
        <p class="creator-credit">created by 11lolol11__ · @ER__etet</p>
      </div>
      <div class="top-actions">
        <button class="ghost-button" id="randomizeBtn">
          <i data-lucide="sparkles"></i>
          톤 맞춤
        </button>
        <button class="ghost-button" id="resetBtn">
          <i data-lucide="rotate-ccw"></i>
          초기화
        </button>
        <button class="primary-button" id="downloadBtn">
          <i data-lucide="download"></i>
          PNG 다운로드
        </button>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel controls">
        <section class="control-group">
          <div class="group-title">
            <i data-lucide="layout-template"></i>
            <h2>폼</h2>
            <span>FORM_00</span>
          </div>
          <button class="upload-row" type="button" data-file-target="backgroundInput">
            <span>배경 폼</span>
            <strong id="backgroundFileName">선택 안 함</strong>
          </button>
          <input class="file-input" id="backgroundInput" type="file" accept="image/*" />
          <div class="segmented" id="backgroundModeSegment">
            <button data-bg-mode="default" class="active">기본</button>
            <button data-bg-mode="solid">단색</button>
            <button data-bg-mode="image">이미지</button>
          </div>
          <div class="crop-controls" data-image-adjust="background">
            <label>배경 가로 위치<input id="backgroundPosXInput" type="range" min="-100" max="100" value="0" /></label>
            <label>배경 세로 위치<input id="backgroundPosYInput" type="range" min="-100" max="100" value="0" /></label>
            <label>배경 확대/크롭<input id="backgroundZoomInput" type="range" min="100" max="260" value="100" /></label>
          </div>
        </section>

        <section class="control-group">
          <div class="group-title">
            <i data-lucide="user-round"></i>
            <h2>프로필</h2>
            <span>ID_01</span>
          </div>
          <label>닉네임<input id="nicknameInput" type="text" maxlength="20" /></label>
          <label>X 아이디<input id="handleInput" type="text" maxlength="24" /></label>
          <label>캐치프레이즈<input id="catchphraseInput" type="text" maxlength="32" /></label>
          <label>한 줄 소개<textarea id="bioInput" maxlength="72" rows="3"></textarea></label>
          <div class="upload-pair">
            <button class="upload-row" type="button" data-file-target="profileImageInput">
              <span>메인 프로필 이미지</span>
              <strong id="profileImageFileName">선택 안 함</strong>
            </button>
            <input class="file-input" id="profileImageInput" type="file" accept="image/*" />
          </div>
          <div class="crop-controls" data-image-adjust="profileImage">
            <label>프로필 가로 위치<input id="profileImagePosXInput" type="range" min="-100" max="100" value="0" /></label>
            <label>프로필 세로 위치<input id="profileImagePosYInput" type="range" min="-100" max="100" value="0" /></label>
            <label>프로필 확대/크롭<input id="profileImageZoomInput" type="range" min="100" max="260" value="100" /></label>
          </div>
        </section>

        <section class="control-group">
          <div class="group-title">
            <i data-lucide="shield"></i>
            <h2>게임 정보</h2>
            <span>DATA_SYNC</span>
          </div>
          <label>티어
            <select id="tierSelect">
              <option selected value="">선택 안 함</option>
              <option>언랭크</option>
              <option>아이언</option>
              <option>브론즈</option>
              <option>실버</option>
              <option>골드</option>
              <option>플래티넘</option>
              <option>다이아몬드</option>
              <option>메테오라이트</option>
              <option>미스릴</option>
              <option>데미갓</option>
              <option>이터니티</option>
            </select>
          </label>
          <div class="chip-field">
            <span>선호 모드</span>
            <div class="chips multi" data-key="modes">
              <button>일반</button><button>랭크</button><button>코발트</button><button>내전</button>
            </div>
          </div>
          <div class="chip-field">
            <span>디스코드</span>
            <div class="chips single" data-key="voice">
              <button>사용</button><button>미사용</button><button>듣코만</button>
            </div>
          </div>
          <div class="chip-field">
            <span>성향</span>
            <div class="chips multi" data-key="traits">
              <button>즐겜</button><button>빡겜</button><button>랭크만 빡겜</button>
            </div>
          </div>
          <div class="chip-field">
            <span>접속 시간대</span>
            <div class="chips multi" data-key="time">
              <button>오전</button><button>오후</button><button>밤</button><button>상시</button><button>랜덤</button>
            </div>
          </div>
        </section>
      </aside>

      <section class="stage">
        <div class="stage-head">
          <p class="eyebrow">LIVE PREVIEW</p>
          <strong>실시간 미리보기</strong>
        </div>
        <div class="canvas-shell">
          <canvas id="profileCanvas" width="1400" height="1400"></canvas>
        </div>
      </section>

      <aside class="panel controls">
        <section class="control-group">
          <div class="group-title">
            <i data-lucide="heart"></i>
            <h2>교류</h2>
            <span>SOCIAL</span>
          </div>
          <div class="chip-field">
            <span>성별</span>
            <div class="chips single" data-key="gender">
              <button>여성</button><button>남성</button><button>비공개</button>
            </div>
          </div>
          <div class="chip-field">
            <span>나이</span>
            <div class="chips single" data-key="age">
              <button>성인</button><button>미성년자</button><button>비공개</button>
            </div>
          </div>
          <div class="chip-field">
            <span>타장르 언급</span>
            <div class="chips single" data-key="genre">
              <button>O</button><button>X</button>
            </div>
          </div>
          <div class="chip-field">
            <span>활동</span>
            <div class="chips multi" data-key="activity">
              <button>연성</button><button>소비</button><button>흔적</button><button>일상</button><button>기타</button>
            </div>
          </div>
          <label>활동 기타<input id="activityOtherInput" type="text" maxlength="48" /></label>
          <div class="chip-field">
            <span>이별</span>
            <div class="chips single" data-key="bye">
              <button>블락</button><button>블언블</button><button>언팔</button>
            </div>
          </div>
          <label>메모<textarea id="memoInput" maxlength="96" rows="4"></textarea></label>
        </section>

        <section class="control-group">
          <div class="group-title">
            <i data-lucide="palette"></i>
            <h2>스타일</h2>
            <span>VISUAL</span>
          </div>
          <label>포인트 색상<input id="accentInput" type="color" value="#ff2d78" /></label>
          <label>보조 색상<input id="subAccentInput" type="color" value="#00ffcc" /></label>
          <label>배경 시작 색상<input id="bgStartInput" type="color" value="#050508" /></label>
          <label>배경 끝 색상<input id="bgEndInput" type="color" value="#1a1a2e" /></label>
          <label>다운로드 폰트
            <select id="canvasFontSelect">
              <option value="NotGothicButGoding" style="font-family: NotGothicButGoding, sans-serif">고딕 아니고 고딩</option>
              <option value="NanumSquare" style="font-family: NanumSquare, sans-serif">나눔스퀘어</option>
              <option value="Netmarble" style="font-family: Netmarble, sans-serif">넷마블체</option>
              <option value="NexonLv2Gothic" style="font-family: NexonLv2Gothic, sans-serif">넥슨 Lv.2 고딕</option>
              <option value="JoseonGulim" style="font-family: JoseonGulim, sans-serif">조선 굴림체</option>
              <option value="ChosunIlboMyungjo" style="font-family: ChosunIlboMyungjo, serif">조선일보명조체</option>
              <option value="Paperozi" style="font-family: Paperozi, sans-serif">페이퍼 로지</option>
              <option value="Pretendard" style="font-family: Pretendard, sans-serif">프리텐다드</option>
              <option value="GMarketSans" style="font-family: GMarketSans, sans-serif">G마켓 산스</option>
              <option value="KoPubWorld Dotum" style="font-family: 'KoPubWorld Dotum', sans-serif">KoPub 돋움</option>
              <option value="KoPubWorld Batang" style="font-family: 'KoPubWorld Batang', serif">KoPub 바탕</option>
              <option value="Mona12" style="font-family: Mona12, monospace">Mona12</option>
              <option value="Wanted Sans Variable" style="font-family: 'Wanted Sans Variable', sans-serif">Wanted Sans</option>
            </select>
          </label>
          <label>글자 크기<input id="fontScaleInput" type="range" min="85" max="120" value="100" /></label>
          <label>이미지 어둡게<input id="imageDimInput" type="range" min="0" max="65" value="28" /></label>
        </section>

        <section class="control-group">
          <div class="group-title">
            <i data-lucide="images"></i>
            <h2>실험체 슬롯</h2>
            <span>SLOTS</span>
          </div>
          <div class="character-picker">
            <div class="character-block">
              <label>주캐<input id="mainCharactersInput" type="text" maxlength="42" /></label>
              <div class="skin-selects" id="mainCharacterSkinSelects"></div>
            </div>
            <div class="character-block">
              <label>애정캐<input id="loveCharactersInput" type="text" maxlength="42" /></label>
              <div class="skin-selects" id="loveCharacterSkinSelects"></div>
            </div>
          </div>
        </section>
      </aside>
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="character-assets.js?v=20260529-skinfix2"></script>
    <script src="app.js?v=20260529-facecrop2"></script>
  </body>
</html>
