<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이터널리턴 트친소표 제작기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">ETERNAL RETURN</p>
        <h1>트친소표 제작기</h1>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="saveJsonBtn" title="작업 저장">
          <i data-lucide="save"></i>
        </button>
        <label class="icon-button file-action" title="작업 불러오기">
          <i data-lucide="folder-open"></i>
          <input id="loadJsonInput" type="file" accept="application/json" />
        </label>
        <button class="primary-button" id="downloadBtn">
          <i data-lucide="download"></i>
          PNG 다운로드
        </button>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel controls">
        <section class="control-group">
          <div class="group-title">
            <i data-lucide="layout-template"></i>
            <h2>폼</h2>
          </div>
          <div class="template-grid" id="templateGrid"></div>
          <label class="upload-row">
            <span>배경 폼 등록</span>
            <input id="backgroundInput" type="file" accept="image/*" />
          </label>
          <div class="segmented" id="ratioSegment">
            <button data-ratio="square" class="active">1:1</button>
            <button data-ratio="wide">16:9</button>
            <button data-ratio="post">4:5</button>
          </div>
        </section>

        <section class="control-group">
          <div class="group-title">
            <i data-lucide="user-round"></i>
            <h2>프로필</h2>
          </div>
          <label>닉네임<input id="nicknameInput" type="text" maxlength="20" placeholder="예: 루미아의 친구" /></label>
          <label>X 아이디<input id="handleInput" type="text" maxlength="24" placeholder="@username" /></label>
          <label>주 실험체<input id="mainCharacterInput" type="text" maxlength="18" placeholder="예: 아야 / 헤이즈" /></label>
          <label>한 줄 소개<textarea id="bioInput" maxlength="72" rows="3" placeholder="같이 게임할 친구를 찾고 있어요."></textarea></label>
          <label class="upload-row">
            <span>메인 이미지</span>
            <input id="mainImageInput" type="file" accept="image/*" />
          </label>
          <label class="upload-row">
            <span>가운데 프로필 사진</span>
            <input id="profileImageInput" type="file" accept="image/*" />
          </label>
        </section>

        <section class="control-group">
          <div class="group-title">
            <i data-lucide="shield"></i>
            <h2>게임 정보</h2>
          </div>
          <label>티어
            <select id="tierSelect">
              <option>언랭크</option>
              <option>아이언</option>
              <option>브론즈</option>
              <option>실버</option>
              <option selected>골드</option>
              <option>플래티넘</option>
              <option>다이아몬드</option>
              <option>메테오라이트</option>
              <option>미스릴</option>
              <option>데미갓</option>
              <option>이터니티</option>
            </select>
          </label>
          <div class="chip-field">
            <span>선호 모드</span>
            <div class="chips multi" data-key="modes">
              <button class="active">일반</button><button>랭크</button><button>코발트</button><button>내전</button>
            </div>
          </div>
          <div class="chip-field">
            <span>디스코드</span>
            <div class="chips single" data-key="voice">
              <button>듣기</button><button>말하기</button><button class="active">전부</button><button>미사용</button>
            </div>
          </div>
          <div class="chip-field">
            <span>성향</span>
            <div class="chips multi" data-key="traits">
              <button class="active">즐겜</button><button>빡겜</button><button>랭크</button><button>일겜</button><button>초보환영</button><button>디코</button>
            </div>
          </div>
        </section>
      </aside>

      <section class="stage">
        <div class="canvas-shell">
          <canvas id="profileCanvas" width="1400" height="1400"></canvas>
        </div>
        <div class="mini-toolbar">
          <button id="randomizeBtn"><i data-lucide="sparkles"></i> 랜덤 톤</button>
          <button id="resetBtn"><i data-lucide="rotate-ccw"></i> 초기화</button>
          <label class="toggle">
            <input type="checkbox" id="guideToggle" checked />
            <span>가이드</span>
          </label>
        </div>
      </section>

      <aside class="panel controls">
        <section class="control-group">
          <div class="group-title">
            <i data-lucide="heart"></i>
            <h2>교류</h2>
          </div>
          <div class="chip-field">
            <span>성별</span>
            <div class="chips single" data-key="gender">
              <button>여</button><button>남</button><button class="active">기타</button>
            </div>
          </div>
          <div class="chip-field">
            <span>나이</span>
            <div class="chips single" data-key="age">
              <button class="active">성인</button><button>청소년</button><button>기타</button>
            </div>
          </div>
          <div class="chip-field">
            <span>활동</span>
            <div class="chips multi" data-key="activity">
              <button>연성</button><button class="active">소비</button><button class="active">흔적</button><button>일상</button><button>기타</button>
            </div>
          </div>
          <label>활동 기타<input id="activityOtherInput" type="text" maxlength="16" placeholder="예: 대회 관전" /></label>
          <div class="chip-field">
            <span>이별</span>
            <div class="chips single" data-key="bye">
              <button>블락</button><button class="active">블언블</button><button>언팔</button>
            </div>
          </div>
          <label>메모<textarea id="memoInput" maxlength="96" rows="4" placeholder="접속 시간, 좋아하는 플레이, 지뢰 요소 등을 적어보세요."></textarea></label>
        </section>

        <section class="control-group">
          <div class="group-title">
            <i data-lucide="palette"></i>
            <h2>스타일</h2>
          </div>
          <label>포인트 색상<input id="accentInput" type="color" value="#13c8b5" /></label>
          <label>보조 색상<input id="subAccentInput" type="color" value="#ffcf5a" /></label>
          <label>배경 시작 색상<input id="bgStartInput" type="color" value="#071011" /></label>
          <label>배경 끝 색상<input id="bgEndInput" type="color" value="#173735" /></label>
          <label>글자 크기<input id="fontScaleInput" type="range" min="85" max="120" value="100" /></label>
          <label>이미지 밝기<input id="imageDimInput" type="range" min="0" max="55" value="12" /></label>
        </section>

        <section class="control-group">
          <div class="group-title">
            <i data-lucide="images"></i>
            <h2>캐릭터 슬롯</h2>
          </div>
          <label>주캐릭터 1<input id="fav1Input" type="text" maxlength="14" placeholder="예: 쇼이치" /></label>
          <label>주캐릭터 2<input id="fav2Input" type="text" maxlength="14" placeholder="예: 레녹스" /></label>
          <label>애정캐릭터 1<input id="love1Input" type="text" maxlength="14" placeholder="예: 엠마" /></label>
          <label>애정캐릭터 2<input id="love2Input" type="text" maxlength="14" placeholder="예: 리오" /></label>
        </section>
      </aside>
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
