<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이터널리턴 트친소표 제작기</title>
    <link rel="stylesheet" href="style.css?v=20260528-finalui3" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">ETERNAL RETURN</p>
        <h1>트친소표 제작기</h1>
      </div>
      <div class="top-actions">
        <button class="primary-button" id="downloadBtn">
          <i data-lucide="download"></i>
          PNG 다운로드
        </button>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel controls">
        <section class="control-group">
          <div class="group-title">
            <i data-lucide="layout-template"></i>
            <h2>폼</h2>
          </div>
          <button class="upload-row" type="button" data-file-target="backgroundInput">
            <span>배경 폼</span>
            <strong id="backgroundFileName">선택 안 함</strong>
          </button>
          <input class="file-input" id="backgroundInput" type="file" accept="image/*" />
          <div class="segmented" id="backgroundModeSegment">
            <button data-bg-mode="default" class="active">기본</button>
            <button data-bg-mode="solid">단색</button>
            <button data-bg-mode="image">이미지</button>
          </div>
        </section>

        <section class="control-group">
          <div class="group-title">
            <i data-lucide="user-round"></i>
            <h2>프로필</h2>
          </div>
          <label>닉네임<input id="nicknameInput" type="text" maxlength="20" placeholder="예: 루미아의 친구" /></label>
          <label>X 아이디<input id="handleInput" type="text" maxlength="24" placeholder="@username" /></label>
          <label>캐치프레이즈<input id="catchphraseInput" type="text" maxlength="32" placeholder="예: 오늘도 루미아섬에서 만나요" /></label>
          <label>한 줄 소개<textarea id="bioInput" maxlength="72" rows="3" placeholder="같이 게임할 친구를 찾고 있어요."></textarea></label>
          <div class="upload-pair">
            <button class="upload-row" type="button" data-file-target="mainImageInput">
              <span>메인 이미지</span>
              <strong id="mainImageFileName">선택 안 함</strong>
            </button>
            <input class="file-input" id="mainImageInput" type="file" accept="image/*" />
            <button class="upload-row" type="button" data-file-target="profileImageInput">
              <span>프로필 사진</span>
              <strong id="profileImageFileName">선택 안 함</strong>
            </button>
            <input class="file-input" id="profileImageInput" type="file" accept="image/*" />
          </div>
        </section>

        <section class="control-group">
          <div class="group-title">
            <i data-lucide="shield"></i>
            <h2>게임 정보</h2>
          </div>
          <label>티어
            <select id="tierSelect">
              <option selected value="">선택 안 함</option>
              <option>언랭크</option>
              <option>아이언</option>
              <option>브론즈</option>
              <option>실버</option>
              <option>골드</option>
              <option>플래티넘</option>
              <option>다이아몬드</option>
              <option>메테오라이트</option>
              <option>미스릴</option>
              <option>데미갓</option>
              <option>이터니티</option>
            </select>
          </label>
          <div class="chip-field">
            <span>선호 모드</span>
            <div class="chips multi" data-key="modes">
              <button>일반</button><button>랭크</button><button>코발트</button><button>내전</button>
            </div>
          </div>
          <div class="chip-field">
            <span>디스코드</span>
            <div class="chips single" data-key="voice">
              <button>듣기</button><button>말하기</button><button>전부</button><button>미사용</button>
            </div>
          </div>
          <div class="chip-field">
            <span>성향</span>
            <div class="chips multi" data-key="traits">
              <button>즐겜</button><button>빡겜</button><button>랭크</button><button>일겜</button><button>초보환영</button><button>디코</button>
            </div>
          </div>
        </section>
      </aside>

      <section class="stage">
        <div class="canvas-shell">
          <canvas id="profileCanvas" width="1400" height="1400"></canvas>
        </div>
        <div class="mini-toolbar">
          <button id="randomizeBtn"><i data-lucide="sparkles"></i> 톤 맞춤</button>
          <button id="resetBtn"><i data-lucide="rotate-ccw"></i> 초기화</button>
        </div>
      </section>

      <aside class="panel controls">
        <section class="control-group">
          <div class="group-title">
            <i data-lucide="heart"></i>
            <h2>교류</h2>
          </div>
          <div class="chip-field">
            <span>성별</span>
            <div class="chips single" data-key="gender">
              <button>여</button><button>남</button><button>기타</button>
            </div>
          </div>
          <div class="chip-field">
            <span>나이</span>
            <div class="chips single" data-key="age">
              <button>성인</button><button>청소년</button><button>기타</button>
            </div>
          </div>
          <div class="chip-field">
            <span>활동</span>
            <div class="chips multi" data-key="activity">
              <button>연성</button><button>소비</button><button>흔적</button><button>일상</button><button>기타</button>
            </div>
          </div>
          <label>활동 기타<input id="activityOtherInput" type="text" maxlength="48" placeholder="예: 대회 관전, 그림, 친선" /></label>
          <div class="chip-field">
            <span>이별</span>
            <div class="chips single" data-key="bye">
              <button>블락</button><button>블언블</button><button>언팔</button>
            </div>
          </div>
          <label>메모<textarea id="memoInput" maxlength="96" rows="4" placeholder="접속 시간, 좋아하는 플레이, 지뢰 요소 등을 적어보세요."></textarea></label>
        </section>

        <section class="control-group">
          <div class="group-title">
            <i data-lucide="palette"></i>
            <h2>스타일</h2>
          </div>
          <label>포인트 색상<input id="accentInput" type="color" value="#13c8b5" /></label>
          <label>보조 색상<input id="subAccentInput" type="color" value="#ffcf5a" /></label>
          <label>배경 시작 색상<input id="bgStartInput" type="color" value="#071011" /></label>
          <label>배경 끝 색상<input id="bgEndInput" type="color" value="#173735" /></label>
          <label>다운로드 폰트
            <select id="canvasFontSelect">
              <option value="Paperozi" style="font-family: Paperozi, sans-serif">페이퍼 로지</option>
              <option value="Pretendard" style="font-family: Pretendard, sans-serif">프리텐다드</option>
              <option value="ChosunIlboMyungjo" style="font-family: ChosunIlboMyungjo, serif">조선일보명조체</option>
              <option value="Mona12" style="font-family: Mona12, monospace">Mona12</option>
              <option value="MitmiFont" style="font-family: MitmiFont, sans-serif">밑미 폰트</option>
            </select>
          </label>
          <label>글자 크기<input id="fontScaleInput" type="range" min="85" max="120" value="100" /></label>
          <label>이미지 어둡게<input id="imageDimInput" type="range" min="0" max="65" value="28" /></label>
        </section>

        <section class="control-group">
          <div class="group-title">
            <i data-lucide="images"></i>
            <h2>캐릭터 슬롯</h2>
          </div>
          <div class="character-picker">
            <div class="character-block">
              <label>주캐<input id="mainCharactersInput" type="text" maxlength="42" placeholder="예: 아야, 레녹스, 헤이즈" /></label>
            </div>
            <div class="character-block">
              <label>애정캐<input id="loveCharactersInput" type="text" maxlength="42" placeholder="예: 엠마, 리오, 프리야" /></label>
            </div>
          </div>
        </section>
      </aside>
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="app.js?v=20260528-finalui3"></script>
  </body>
</html>
